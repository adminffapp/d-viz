name: Saatlik piyasa kuru
on:
  schedule:
    - cron: '7 * * * *'   # her saatin 7. dakikası (UTC). Hafta sonu betik istek atmadan çıkar.
  workflow_dispatch:
    inputs:
      zorla:
        description: 'Piyasa kapalı olsa da çek (deneme)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: veri-yazimi        # günlük TCMB işiyle aynı anda git'e yazmasın
  cancel-in-progress: false
jobs:
  saatlik:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Bağımlılık gerekmez: betik yalnızca Node'un kendi modüllerini kullanır.
      - name: Piyasa kurunu çek
        env:
          OXR_APP_ID: ${{ secrets.OXR_APP_ID }}
        run: node scripts/saatlik.mjs ${{ inputs.zorla && '--zorla' || '' }}
      - name: Değişikliği kaydet
        run: |
          git config user.name "kur-botu"
          git config user.email "kur-botu@users.noreply.github.com"
          git add public/data/saatlik.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Saatlik piyasa kuru"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
